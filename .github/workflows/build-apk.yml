name: Build and Release Debug APK and AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "JAVA_HOME: $JAVA_HOME"
          java -version
          JAVA_VERSION_OUTPUT=$(java -version 2>&1)
          JAVA_MAJOR=$(echo "$JAVA_VERSION_OUTPUT" | awk -F '"' '/version/ {print $2}' | awk -F '.' '{if ($1 == "1") print $2; else print $1}')
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ -z "$JAVA_MAJOR" ] || [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Java 17 or higher is required. Detected version: $JAVA_MAJOR"
            exit 1
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            echo "Creating temporary debug keystore..."
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "debug.keystore already exists."
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "Error: ./debug.keystore not found."
            exit 1
          fi
          echo "debug.keystore verified successfully."

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Build Debug AAB
        run: |
          gradle :app:bundleDebug --stacktrace --no-daemon

      - name: Verify APK and AAB outputs
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          EXPECTED_AAB="app/build/outputs/bundle/debug/app-debug.aab"
          FAILED=0

          if [ -f "$EXPECTED_APK" ] && [ -s "$EXPECTED_APK" ] && [[ "$EXPECTED_APK" == *.apk ]]; then
            echo "Verified expected APK: $EXPECTED_APK ($(stat -c%s "$EXPECTED_APK") bytes)"
          else
            echo "Error: Expected APK does not exist, is empty, or has incorrect extension: $EXPECTED_APK"
            FAILED=1
          fi

          if [ -f "$EXPECTED_AAB" ] && [ -s "$EXPECTED_AAB" ] && [[ "$EXPECTED_AAB" == *.aab ]]; then
            echo "Verified expected AAB: $EXPECTED_AAB ($(stat -c%s "$EXPECTED_AAB") bytes)"
          else
            echo "Error: Expected AAB does not exist, is empty, or has incorrect extension: $EXPECTED_AAB"
            FAILED=1
          fi

          if [ "$FAILED" -ne 0 ]; then
            echo "Searching only inside app/build/outputs for discovered APK and AAB files:"
            find app/build/outputs -maxdepth 4 -type f \( -name "*.apk" -o -name "*.aab" \) || true
            exit 1
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload debug AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-aab
          path: app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error

      - name: Prepare APK and AAB release assets
        id: prepare_assets
        run: |
          TEMP_DIR="${RUNNER_TEMP}/release-assets"
          mkdir -p "$TEMP_DIR"
          APK_ASSET="${TEMP_DIR}/app-debug.apk"
          AAB_ASSET="${TEMP_DIR}/app-debug.aab"
          cp "app/build/outputs/apk/debug/app-debug.apk" "$APK_ASSET"
          cp "app/build/outputs/bundle/debug/app-debug.aab" "$AAB_ASSET"
          if [ ! -f "$APK_ASSET" ] || [ ! -s "$APK_ASSET" ]; then
            echo "Error: Failed to prepare APK release asset at $APK_ASSET"
            exit 1
          fi
          if [ ! -f "$AAB_ASSET" ] || [ ! -s "$AAB_ASSET" ]; then
            echo "Error: Failed to prepare AAB release asset at $AAB_ASSET"
            exit 1
          fi
          echo "Prepared APK asset: $APK_ASSET"
          echo "Prepared AAB asset: $AAB_ASSET"
          echo "apk_asset=${APK_ASSET}" >> "$GITHUB_OUTPUT"
          echo "aab_asset=${AAB_ASSET}" >> "$GITHUB_OUTPUT"

      - name: Publish APK and AAB to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          APK_ASSET="${{ steps.prepare_assets.outputs.apk_asset }}"
          AAB_ASSET="${{ steps.prepare_assets.outputs.aab_asset }}"
          if [ ! -f "$APK_ASSET" ] || [ ! -s "$APK_ASSET" ]; then
            echo "Error: Release asset is missing or empty before release publication: $APK_ASSET"
            exit 1
          fi
          if [ ! -f "$AAB_ASSET" ] || [ ! -s "$AAB_ASSET" ]; then
            echo "Error: Release asset is missing or empty before release publication: $AAB_ASSET"
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK + AAB Build #${{ github.run_number }}"
          TARGET_COMMIT="${{ github.sha }}"

          NOTES=$(cat <<'EOF'
          ### Debug APK & AAB Build

          These are automatically generated debug binaries built by GitHub Actions.

          - **Build Type**: Debug (for testing and development purposes)
          - **Artifacts Included**:
            - `app-debug.apk` (Android Application Package)
            - `app-debug.aab` (Android App Bundle)
          - **Signing**: Signed with a temporary debug keystore
          - **Note**: This is not a Google Play Store production release.
          EOF
          )

          gh release create "$RELEASE_TAG" "$APK_ASSET" "$AAB_ASSET" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --target "$TARGET_COMMIT" \
            --latest

      - name: Report build and download results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_STEP_OUTCOME="${{ steps.publish_release.outcome }}"
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK + AAB Build #${{ github.run_number }}"

          echo "=================================================="
          echo "                BUILD SUMMARY                     "
          echo "=================================================="

          if [ "$RELEASE_STEP_OUTCOME" = "success" ]; then
            echo "GitHub Release creation succeeded."
            gh release view "$RELEASE_TAG" || true
            RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "Assets: app-debug.apk, app-debug.aab"
            echo "Both APK and AAB are downloadable from GitHub Release Assets."
            echo "The 'app-debug-apk' and 'app-debug-aab' Actions artifacts are also available."

            {
              echo "## 🚀 Debug APK + AAB Build Succeeded"
              echo ""
              echo "- **Release**: [$RELEASE_TITLE]($RELEASE_URL)"
              echo "- **Release Tag**: \`$RELEASE_TAG\`"
              echo "- **Release Assets**: \`app-debug.apk\` and \`app-debug.aab\` (available under Release Assets)"
              echo "- **Actions Artifacts**:"
              echo "  - \`app-debug-apk\` (available under Workflow Artifacts)"
              echo "  - \`app-debug-aab\` (available under Workflow Artifacts)"
              echo ""
              echo "> ℹ️ These debug binaries were automatically built by GitHub Actions for testing."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: GitHub Release publishing did not succeed."
            echo "The debug APK and AAB builds completed successfully."
            echo "The 'app-debug-apk' and 'app-debug-aab' Actions artifacts remain available for download."

            {
              echo "## ⚠️ Debug APK + AAB Build Completed (Release Warning)"
              echo ""
              echo "- **APK Build**: Succeeded (\`app/build/outputs/apk/debug/app-debug.apk\`)"
              echo "- **AAB Build**: Succeeded (\`app/build/outputs/bundle/debug/app-debug.aab\`)"
              echo "- **Actions Artifacts**:"
              echo "  - \`app-debug-apk\` is available under Workflow Artifacts."
              echo "  - \`app-debug-aab\` is available under Workflow Artifacts."
              echo "- **Release Publishing**: Release creation did not complete. Check workflow logs for details."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
