<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Radial Cyan Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>

    <!-- Letter A Gradient -->
    <linearGradient id="letterGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Accent Neon Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="glowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#38BDF8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Border Ring -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#38BDF8" stroke-width="3" stroke-opacity="0.35"/>

  <!-- Center Ambient Glow Circle -->
  <circle cx="256" cy="256" r="180" fill="url(#centerGlow)"/>

  <!-- Inner Badge Frame -->
  <rect x="106" y="106" width="300" height="300" rx="64" fill="#0B132B" fill-opacity="0.75" stroke="#334155" stroke-width="2"/>
  <rect x="110" y="110" width="292" height="292" rx="60" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Main Emblem: Stylized Bold Geometric Letter 'A' -->
  <g filter="url(#glowShadow)">
    <!-- Outer A Shape with Center Triangle Cutout -->
    <path d="M256,150 L345,362 L297,362 L276,306 L236,306 L215,362 L167,362 Z M256,212 L244,272 L268,272 Z"
          fill="url(#letterGrad)"/>

    <!-- Dynamic Neon Crossbar -->
    <path d="M216,289 L296,289" stroke="url(#neonGrad)" stroke-width="10" stroke-linecap="round"/>

    <!-- Futuristic Spark Dot -->
    <circle cx="348" cy="168" r="14" fill="#38BDF8"/>
    <circle cx="348" cy="168" r="6" fill="#FFFFFF"/>
  </g>
</svg>
