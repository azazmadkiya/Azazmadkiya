name: Build & Sign Android APK and AAB

on:
  push:
    branches:
      - main
  workflow_dispatch: # Manual trigger button ke liye

jobs:
  build:
    name: Build & Sign Release APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build and Sign Release APK & AAB
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: release-signed-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: release-signed-aab
          path: app/build/outputs/bundle/release/app-release.aab
